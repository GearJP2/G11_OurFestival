    <!--js ของฟอร์มregister-->
    <script>
        document.getElementById('registrationForm').addEventListener('submit', function(event) {
            // ตรวจสอบความถูกต้องของฟอร์มตาม HTML5 (Validation)
            if (!this.checkValidity()) {
                event.preventDefault(); 
                event.stopPropagation();
                this.classList.add('was-validated');
                return;
            }
    
            event.preventDefault(); // ป้องกันการส่งฟอร์มตามปกติ
    
            // 1. ดึงข้อมูลฟอร์ม
            const name = document.getElementById('name').value;
            const surname = document.getElementById('surname').value;
            const email = document.getElementById('email').value;
            const tel = document.getElementById('tel').value;
    
            const formData = { name, surname, email, tel };
            
            // 2. สร้างข้อความ HTML สำหรับแสดงผล
            const displayDiv = document.getElementById('display-info');
            displayDiv.innerHTML = `
                <h5 class="text-success">Thank you for registering!</h5>
                <p class="mb-1"><strong>Name:</strong> ${name} ${surname}</p>
                <p class="mb-1"><strong>Email:</strong> ${email}</p>
                <p class="mb-0"><strong>Tel:</strong> ${tel}</p>
            `;
            displayDiv.style.display = 'block'; // แสดงผลข้อมูล

    
            // 3. **ขั้นตอนส่งข้อมูลไปบันทึกด้วย PHP (ผ่าน Fetch API)**
            fetch('save_data.php', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: new URLSearchParams(formData)
            })
            .then(response => response.text())
            .then(data => {
                console.log('Server response:', data); 
                // ล้างฟอร์ม
                this.reset();
                this.classList.remove('was-validated');

               // POPUP
                alert('Thank you for registering!');
                 // **เนื่องจากคุณต้องการให้ "กดแบล็คไปหน้าหลัก" หลัง Submit** // ถ้าคุณต้องการให้ย้ายไปหน้าหลักทันทีหลังแสดงข้อมูล ให้เพิ่มโค้ดนี้:
            window.location.href = 'index.html'; 


            })
            .catch(error => {
                console.error('Error saving data:', error);
                displayDiv.innerHTML = `<h5 class="text-danger">Error: Could not save data.</h5>`;
                displayDiv.style.display = 'block';
            });
            
           
        });
        
        // โค้ด scrollToTop เดิม
        function scrollToTop() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
